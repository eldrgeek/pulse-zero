<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #0b0d10; color: #f0f2f4; min-height: 100vh; min-height: 100dvh;
  }
  @media (prefers-color-scheme: light) {
    body { background: #f4f5f7; color: #14171a; }
  }
  header {
    position: sticky; top: 0; padding: 14px 16px; background: rgba(20,22,26,0.9);
    backdrop-filter: blur(8px); border-bottom: 1px solid #2a2d31; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
  }
  @media (prefers-color-scheme: light) {

  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header .count { font-size: 13px; opacity: 0.6; }

  .empty { text-align: center; opacity: 0.5; padding: 60px 20px; font-size: 15px; }
  .offline-banner {
    background: #3a2e12; color: #e8b545; border: 1px solid #5a4620; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 13px; line-height: 1.4;
  }

  }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .kind {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px;
  }
  .kind-action { background: #3a2e12; color: #e8b545; }
  .kind-verdict { background: #12302e; color: #4ecdc4; }
  .kind-decision { background: #2a1830; color: #d68fe0; }
  .kind-brief { background: #16233a; color: #6ea8fe; }
  .escalation {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px;
    margin-left: 6px; background: #3a1414; color: #ff9a8a; vertical-align: middle;
  }
  .title { font-size: 16.5px; font-weight: 620; margin: 0 0 4px; line-height: 1.3; }
  .why, .body-text { font-size: 14px; opacity: 0.75; margin: 0 0 10px; line-height: 1.45; white-space: pre-wrap; }
  /* overflow-wrap:anywhere (UX#2b, 2026-08-14) — additive-only (does not
     redeclare font-size/opacity/margin, which would fight the earlier
     .drill-fulltext rule under equal-specificity cascade order): a blanket
     safety net so one unbreakable token (a long URL/hash/token with no
     auto-link match) can never again widen the whole page past the viewport,
     regardless of whether renderInlineText()'s auto-linkifier caught it. */
  .why, .body-text, .drill-fulltext { overflow-wrap: anywhere; }
  a.link { color: #6ea8fe; word-break: break-all; }
  /* Unified drill-down accordion (steps + brief full-text). Default:
     opening one closes every other open, unpinned drill (Mike, 2026-08-13).
     Touch target padding trick keeps the compact underlined-link look while
     still hitting the >=44px tap-target floor (padding expands the
     clickable area; negative margin keeps the visual box the same size). */
  .drill { margin: 8px 0 10px; }
  .drill-header { display: flex; align-items: center; gap: 2px; }
  .drill-toggle {
    background: none; border: none; padding: 12px 4px; margin: -12px 0 -12px -4px;
    font-size: 13px; font-weight: 600; opacity: 0.7; cursor: pointer; color: inherit;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .drill-toggle:focus-visible { outline: 2px solid #6ea8fe; outline-offset: 2px; opacity: 1; }
  .drill-pin {
    background: none; border: none; width: 32px; height: 32px; margin: -6px 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; opacity: 0.35; cursor: pointer; border-radius: 6px;
  }
  .drill-pin.pinned { opacity: 1; background: #2a2210; }
  .drill-pin:focus-visible { outline: 2px solid #6ea8fe; outline-offset: 1px; }
  .drill-fulltext { font-size: 13.5px; opacity: 0.85; line-height: 1.5; white-space: pre-wrap; margin: 8px 0 0; }
  .drill-hint {
    font-size: 12.5px; opacity: 0.65; padding: 8px 10px; margin: 0 0 10px;
    border: 1px solid #2a2a2a; border-radius: 8px; display: flex;
    align-items: center; justify-content: space-between; gap: 10px;
  }
  .drill-hint button { background: none; border: none; color: #6ea8fe; cursor: pointer; padding: 8px; font-size: 12.5px; }
  .steps-list { list-style: none; margin: 8px 0 0; padding: 0; }
  .step-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: 13.5px; line-height: 1.4; }
  .step-item label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; width: 100%; }
  .step-item input[type="checkbox"] { flex-shrink: 0; width: 18px; height: 18px; margin: 1px 0 0; accent-color: #2f6fed; }
  .step-item.checked span { text-decoration: line-through; opacity: 0.55; }
  .step-item { flex-wrap: wrap; }
  .step-item label { flex: 1 1 auto; min-width: 0; }
  .step-item label span { overflow-wrap: anywhere; }
  .step-action-btn {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    font: inherit; font-size: 12.5px; font-weight: 650; padding: 7px 12px; border-radius: 8px;
    min-height: 44px; background: #1d3a6e; color: #a8c8ff;
    border: 1px solid #2f5fc4; margin-left: 26px; cursor: pointer; text-decoration: none;

  .step-action-btn:disabled { opacity: 0.6; cursor: default; }
  .step-action-btn.state-failed { background: #3a1414; color: #ff9a9a; border-color: #5a2020; }
  .step-action-btn.state-done { background: #12302e; color: #4ecdc4; border-color: #1c4a46; }
  .step-action-note { flex-basis: 100%; margin: 4px 0 0 26px; font-size: 12px; opacity: 0.75; }
  .card-actions { margin: 10px 0; display: grid; gap: 8px; }
  .card-actions-title { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.58; }
  .card-action-row {
    padding: 10px; border: 1px solid #2a2d31; border-radius: 10px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center;

  @media (prefers-color-scheme: light) { .card-action-row { border-color: #dfe2e6; } }

  /* Touch-target floor (UX#5, 2026-08-14): a live sweep at 412x915 found
     every Open/Preview/Ask Pulse/Done/Snooze/Not mine/Ack button measuring

  .btn-primary, .btn-secondary, .btn-destructive { min-height: 44px; padding: 12px 16px; }

  input.textresp {

  .login { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 24px; }

  .login-box .google-btn {

  .muted { opacity: 0.55; font-size: 13px; }
  /* soma-feedback chip (§8) sits bottom-left by default; nudge it above the
     persistent #talk-bar so the two don't overlap. */
  /* UX#1 (2026-08-14): bottom-LEFT (the vendor default) put the chip
     directly on top of the board's own left-anchored card action rows —

  .soma-feedback-root { bottom: 82px; left: auto; right: 12px; }

<script>
const SUPABASE_URL = 'https://omfwcodoimjmbrhssvfl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vi2qDWjozUJ5mi9dwirkLA_rj6UaqLf';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const APP_ID = 'pulse-zero';
const app = document.getElementById('app');
window.pulseSupabase = sb;
window.pulseAuthenticated = false;

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Escalation banner (WQ-261) ──────────────────────────────────────
// The "⏫ Day N — still waiting: " nudge is a RENDER concern, not part of a
// card's title. pulse-drain historically concatenated it into the stored
// title, which (a) broke the one-imperative-line-≤60-char board contract,
// (b) truncated real titles mid-word as the banner ate the budget, and
// (c) compounded into "still waiting: still waiting: " because the strip
// regex only half-matched its own previous output.
//
// `payload.escalation_day` is already a first-class field on every escalated
// card, so the banner is derived from it here and stripped from whatever the
// stored title happens to carry. Rows written the old way still render
// sanely; rows written without the banner render identically. This is the
// prerequisite for dropping ESCALATION_TITLE_MAX (=160) and collapsing the
// two title contracts back to one.
function stripEscalationBanner(title) {
  let t = String(title == null ? '' : title).trim();
  t = t.replace(/^⏫\s*Day\s*\d+\s*[—–-]\s*/i, '');
  // Repeated prefixes: the old regex left one behind per escalation.
  let guard = 0;
  while (/^still waiting:\s*/i.test(t) && guard++ < 20) {
    t = t.replace(/^still waiting:\s*/i, '');
  }
  return t.trim();
}

function escalationDay(c) {
  const n = Number(((c || {}).payload || {}).escalation_day || 0);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function escalationBadge(c) {
  const day = escalationDay(c);
  if (!day) return '';
  return `<span class="escalation" title="Escalated by pulse-drain — still waiting after ${day} day${day === 1 ? '' : 's'}">⏫ Day ${day}</span>`;
}

// CODE#10 (2026-08-14): created_by defaults to 'unknown' (DB column default
// + pulse-push's own loud-warn fallback) with previously zero on-board
// signal — Mike had no way to see, from the card itself, that a card is
// unattributed. Cheap, visible marker; matches the escalation badge's style.
function sourceUnknownBadge(c) {
  if ((c || {}).created_by !== 'unknown') return '';

// ── STEP_ACTIONS_CONVENTION (2026-07-27, ren) ────────────────────────────
// CONTRACT.md left action-type encoding on payload.steps ambiguous — the
// real card checked ('vps-group-bc-creds-restore') just has plain numbered
// text, no marker. Convention adopted: an optional payload.step_actions
// array, index-aligned 1:1 with the lines parseSteps() produces (0-based).
// Each entry is either null/absent or {command, payload} exactly per
// pulse-mac-bridge/CONTRACT.md's mac_commands shapes (open_session,
// clipboard_set, clipboard_take_and_deploy). open_url is handled entirely
// in the authenticated browser; the other commands use mac_commands.
// pulse-push's --step-actions
// flag writes this. No DB migration needed — payload is already freeform
// jsonb. This is additive/optional: cards without step_actions render
// exactly as before (checklist only, no button).
function stepAction(stepActions, idx) {
  return (Array.isArray(stepActions) && stepActions[idx]) || null;
}

function stepActionLabel(action) {
  if (action && action.label) return action.label;
  return { open_url: 'Open page', open_session: 'Continue on Mac',
    clipboard_set: 'Copy to clipboard',
    clipboard_take_and_deploy: 'Install from clipboard' }[(action || {}).command] || 'Run';
}

function safeHttpUrl(rawUrl) {
  try {
    const parsed = new URL(rawUrl);
    return ['https:', 'http:'].includes(parsed.protocol) ? parsed.href : null;
  } catch (_) {
    return null;
  }
}

// ── Minimal safe inline-text renderer (UX#2 + UX#4, composes with CODE#4) ──
// Card body text (--why/--lines/--full_text) is worker-authored and currently
// renders through esc() only, so markdown syntax (**bold**, _em_, `code`)
// paints literally and a bare URL is un-linked plain text that can blow the
// viewport width (UX#2 finding: 170px of page-wide overflow from one 110-char
// URL). This adds a narrow, allowlisted subset — NEVER raw HTML passthrough.
//
// Safety invariant, load-bearing: every literal text run goes through esc()
// before it touches innerHTML, exactly once, exactly here. The only markup
// this function can ever emit is <strong>, <code>, <em>, and <a href=...> —
// and every href is scheme-checked through safeHttpUrl() (the same function
// CODE#4 uses for card-level links), so a payload like
// "javascript:alert(1)" embedded as bare text never becomes a live link, and
// "<img src=x onerror=alert(1)>" or "[a](javascript:...)" render as inert
// escaped text, never as executable markup. Regex captures are matched
// against the RAW (unescaped) source but every captured group is esc()'d
// before insertion — so a capture can never itself contain an unescaped `<`.
function renderInlineText(raw) {
  const src = String(raw == null ? '' : raw);
  const re = /(\*\*([^*\n]+)\*\*)|(`([^`\n]+)`)|(_([^_\n]+)_)|(https?:\/\/[^\s<>"')]+)/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += `<strong>${esc(m[2])}</strong>`;
    else if (m[3]) out += `<code>${esc(m[4])}</code>`;
    else if (m[5]) out += `<em>${esc(m[6])}</em>`;
    else if (m[7]) {
      const href = safeHttpUrl(m[7]);
      out += href
        ? `<a class="link" href="${esc(href)}" target="_blank" rel="noopener">${esc(m[7])}</a>`
        : esc(m[7]);
    }
    last = re.lastIndex;
  }
  out += esc(src.slice(last));
  return out;
}

function showOverlay(html) {

  backdrop.className = 'overlay-backdrop';

// ── Step checklist ──────────────────────────────────────────────────
// payload.steps is a single '\n'-joined string written by pulse-push's
// --steps flag (see bin/pulse-push). Split into individual checkable
// items instead of dumping it as one run-on blob. Strips a leading
// "1. " / "2) " numbering if the source already numbered lines, since
// the list markup (checkbox) supplies its own visual order.
function parseSteps(raw) {
  return (raw || '')
    .split('\n')
    .map(s => s.trim())
    .filter(Boolean)
    .map(s => s.replace(/^\d+[.)]\s*/, ''));
}

// ── Unified drill-down accordions (steps, brief full-text) ─────────────
// One shared mechanism for every collapsed-by-default detail panel on the
// board. Default: opening one closes every other OPEN, UNPINNED drill
// (Mike, 2026-08-13 — "if I open up one accordion, it closes the other").
// Pin a drill to exempt it: tap its 📌 (the touch equivalent — there is no
// Shift key on a phone, and Mike reads this board there) or hold
// Shift/Cmd/Ctrl while clicking or pressing Enter on its header (a
// keyboard-activated <button> click carries the modifier state of the key
// that triggered it, so Shift+Enter / Cmd+Enter work with no extra code).
function drillMarkup(id, label, bodyHtml) {
  const pinned = uiState.pinnedDrills.has(id);
  return `
    <div class="drill" data-drill="${esc(id)}">
      <div class="drill-header">
        <button class="drill-toggle" data-drill-toggle="${esc(id)}" aria-expanded="false">${label}</button>
        <button type="button" class="drill-pin${pinned ? ' pinned' : ''}" data-drill-pin="${esc(id)}"
          aria-pressed="${pinned}"
          aria-label="${pinned ? 'Unpin — this will close automatically when you open another section' : 'Pin open — keep this section open when you open another'}"
          title="${pinned ? 'Pinned open' : 'Pin open'}">📌</button>
      </div>
      <div class="drill-body" data-drill-body="${esc(id)}" style="display:none;">${bodyHtml}</div>
    </div>`;
}

function setDrillOpen(id, open) {
  const toggle = document.querySelector(`[data-drill-toggle="${id}"]`);
  const body = document.querySelector(`[data-drill-body="${id}"]`);
  if (!toggle || !body) return;
  body.style.display = open ? 'block' : 'none';
  toggle.setAttribute('aria-expanded', String(open));
  if (open) uiState.openDrills.add(id); else uiState.openDrills.delete(id);
}

function togglePin(id) {
  const pinned = !uiState.pinnedDrills.has(id);
  if (pinned) uiState.pinnedDrills.add(id); else uiState.pinnedDrills.delete(id);
  const pinBtn = document.querySelector(`[data-drill-pin="${id}"]`);
  if (pinBtn) {
    pinBtn.classList.toggle('pinned', pinned);
    pinBtn.setAttribute('aria-pressed', String(pinned));
    pinBtn.setAttribute('aria-label', pinned
      ? 'Unpin — this will close automatically when you open another section'
      : 'Pin open — keep this section open when you open another');
    pinBtn.title = pinned ? 'Pinned open' : 'Pin open';
  }
  return pinned;
}

function toggleDrill(id) {
  const opening = !uiState.openDrills.has(id);
  if (opening) {
    for (const otherId of Array.from(uiState.openDrills)) {
      if (otherId !== id && !uiState.pinnedDrills.has(otherId)) setDrillOpen(otherId, false);
    }
  }
  setDrillOpen(id, opening);
}

// Reattaches handlers + reapplies open/pinned state after a re-render.
// Safe to call when the drill doesn't exist on this card (e.g. an action
// card with no steps, or a brief with no full_text) — every lookup is
// null-checked.
function wireDrill(div, id) {
  const toggle = div.querySelector(`[data-drill-toggle="${id}"]`);
  const pinBtn = div.querySelector(`[data-drill-pin="${id}"]`);
  if (!toggle) return;
  if (uiState.openDrills.has(id)) setDrillOpen(id, true);
  toggle.onclick = (e) => {
    const wantsKeepOpen = e.shiftKey || e.metaKey || e.ctrlKey;
    if (wantsKeepOpen) {
      if (!uiState.pinnedDrills.has(id)) togglePin(id);
      if (!uiState.openDrills.has(id)) setDrillOpen(id, true);
    } else {
      toggleDrill(id);
    }
  };
  if (pinBtn) {
    pinBtn.onclick = (e) => {
      e.stopPropagation();
      const pinned = togglePin(id);
      if (pinned && !uiState.openDrills.has(id)) setDrillOpen(id, true);
    };
  }
}

function stepsAccordion(cardId, rawSteps, stepState, stepActions) {
  const items = parseSteps(rawSteps);
  if (!items.length) return '';
  stepState = stepState || {};
  const list = items.map((s, i) => {
    const checked = !!stepState[i];
    const action = stepAction(stepActions, i);
    const verifiedDone = checked && action && action.command !== 'open_url';
    let btn = '';
    if (action && action.command === 'open_url') {
      const href = safeHttpUrl((action.payload || {}).url);
      btn = href
        ? `<a class="step-action-btn" href="${esc(href)}" target="_blank" rel="noopener">${esc(stepActionLabel(action))}</a>`
        : `<button class="step-action-btn state-failed" disabled>Invalid link</button>`;
    } else if (action) {
      btn = `<button class="step-action-btn${verifiedDone ? ' state-done' : ''}" data-step-action-idx="${i}" ${verifiedDone ? 'disabled' : ''}>${verifiedDone ? 'Done' : esc(stepActionLabel(action))}</button>`;
    }
    return `
    <li class="step-item${checked ? ' checked' : ''}" data-step-idx="${i}">
      <label><input type="checkbox" class="step-check" ${checked ? 'checked' : ''} /><span>${esc(s)}</span></label>
      ${btn}
    </li>`;
  }).join('');
  const hasActions = Array.isArray(stepActions) && stepActions.some(Boolean);
  const label = `${hasActions ? 'Steps & actions' : 'Steps'} (${items.length})`;
  return drillMarkup(`steps:${cardId}`, label, `<ul class="steps-list">${list}</ul>`);
}

// One-time discoverability hint for the pin (Mike, 2026-08-13: multi-open
// must be discoverable, not a hidden gesture). Shown until dismissed once;
// dismissal persists in localStorage so it doesn't nag every visit.
function renderDrillHint(main) {
  if (uiState.drillHintDismissed) return;
  const el = document.createElement('div');
  el.className = 'drill-hint';
  el.innerHTML = `<span>Tip: opening a section closes others. Tap 📌 (or hold ⇧/⌘ and click) to keep more than one open.</span>
    <button type="button" data-action="dismiss-drill-hint">Got it</button>`;
  el.querySelector('[data-action="dismiss-drill-hint"]').onclick = () => {
    uiState.drillHintDismissed = true;
    try { localStorage.setItem('pulse_drill_hint_dismissed', '1'); } catch (_) {}
    el.remove();
  };
  main.appendChild(el);
}

// The roundup's own drill-down: a brief card shows a short, always-visible
// digest (payload.lines, ~2-second scan) and, only if the producer supplied
// one, the complete fleet-record body behind this collapsed-by-default
// panel — never dumped inline (Mike, 2026-08-13: "still very wordy").
function briefDrill(cardId, fullText) {
  if (!fullText || !fullText.trim()) return '';
  return drillMarkup(`brief:${cardId}`, 'Full brief', `<div class="drill-fulltext">${esc(fullText)}</div>`);
}

// Poll a single mac_commands row until it leaves status='open'. open_session
// can legitimately take up to 60s, so the UI observes for 75s and reports an
// indeterminate state instead of inventing a failure while the Mac may still
// be completing the command.
async function pollMacCommand(id, onUpdate) {
  const started = Date.now();
  while (Date.now() - started < 75000) {
    const { data, error } = await sb.from('mac_commands').select('status,result').eq('id', id).single();
    if (error) { onUpdate({ status: 'failed', result: { error: error.message } }); return; }
    if (data.status !== 'open') { onUpdate(data); return; }
    await new Promise(r => setTimeout(r, 1500));
  }
  onUpdate({ status: 'observing', result: { error: 'Still working on the Mac. This button will not send a duplicate; check the Mac before trying again.' } });
}

function afkAwareMessage(result) {
  const err = (result && result.error) || '';
  if (err.startsWith('refused: automation-lock state is')) {
    return 'This was treated as background automation, so the Mac safely refused it. Reload Pulse and click again.';
  }
  return err || 'Something went wrong.';
}

async function runStepAction(cardId, stepIdx, action, btn) {
  btn.disabled = true;
  btn.classList.remove('state-failed');
  const li = btn.closest('.step-item');
  let note = li.querySelector('.step-action-note');
  if (!note) { note = document.createElement('div'); note.className = 'step-action-note'; li.appendChild(note); }
  btn.textContent = 'Sending…';
  const payload = { ...(action.payload || {}) };
  if (action.command === 'open_session') {
    // Consent is created by the authenticated click, never stored on the card.
    // The bridge accepts it only while fresh and only for this one handoff.
    payload.interaction = 'user_click';
    payload.requested_at = new Date().toISOString();
  }
  const { data, error } = await sb.from('mac_commands')
    .insert({ command: action.command, payload, status: 'open' })
    .select().single();
  if (error) {
    btn.disabled = false;
    btn.textContent = stepActionLabel(action);
    note.textContent = 'Failed to send: ' + error.message;
    return;
  }
  btn.textContent = 'Running on Mac…';
  note.textContent = 'Picked up by the bridge within ~2s…';
  pollMacCommand(data.id, async (result) => {
    if (result.status === 'done') {
      btn.textContent = 'Done';
      btn.classList.add('state-done');
      note.textContent = action.success_message || 'Done.';
      const cb = li.querySelector('.step-check');
      if (cb && !cb.checked) {
        cb.checked = true;
        li.classList.add('checked');
        await persistStepState(cardId, stepIdx, true);
      }
    } else if (result.status === 'observing') {
      btn.textContent = 'Still working…';
      note.textContent = afkAwareMessage(result.result);
    } else {
      btn.disabled = false;
      btn.textContent = stepActionLabel(action);
      btn.classList.add('state-failed');
      note.textContent = afkAwareMessage(result.result);
    }
  });
}

async function persistStepState(cardId, idx, value) {
  const { data } = await sb.from('pulse_cards').select('step_state').eq('id', cardId).single();
  const merged = { ...(data && data.step_state || {}), [idx]: value };
  await sb.from('pulse_cards').update({ step_state: merged }).eq('id', cardId);
}

function wireSteps(div, c) {
  wireDrill(div, `steps:${c.id}`);
  div.querySelectorAll('.step-item input.step-check').forEach(cb => {
    cb.onchange = async () => {
      const li = cb.closest('.step-item');
      li.classList.toggle('checked', cb.checked);
      const idx = Number(li.dataset.stepIdx);
      await persistStepState(c.id, idx, cb.checked);
    };
  });
  div.querySelectorAll('.step-action-btn[data-step-action-idx]').forEach(btn => {
    const idx = Number(btn.dataset.stepActionIdx);
    const action = stepAction((c.payload || {}).step_actions, idx);
    if (!action) return;
    btn.onclick = () => runStepAction(c.id, idx, action, btn);
  });
}

// ── Typed card actions (payload.actions v1) ────────────────────────
// Every Mike-requested operation is a typed action with a stable id/revision.
// The browser never executes it directly: it creates one durable
// execute_card_action row in mac_commands. workflow/web routes are handed to
// Yeshie by the Mac broker; mac routes are handed to Mac automation. The row
// is both transport and receipt, so reloads resume the same attempt.
function typedActions(c) {
  return PulseActions.parsePayload((c && c.payload) || {});
}

function typedActionRun(c, action) {
  return uiState.actionRuns.get(PulseActions.actionRunKey(c.id, action)) || null;
}

function actionButtonText(phase, action) {
  return {
    idle: action.label,
    queued: 'Queued…',
    running: 'Working…',
    waiting_human: 'Waiting on Mac…',
    verified: 'Done',
  }[phase] || 'Retry';
}

function cardActionsPanel(c) {
  const parsed = typedActions(c);
  if (parsed.errors.length) {
    return `<div class="card-action-contract-error">This card’s action contract is invalid: ${esc(parsed.errors.join('; '))}</div>`;
  }
  if (!parsed.actions.length) return '';
  const rows = parsed.actions.map(action => {
    const run = typedActionRun(c, action);
    const phase = PulseActions.runPhase(run);
    const note = PulseActions.safeResultMessage(run, action);
    const disabled = c.status !== 'open' || !!uiState.actionRunError ||
      ['queued', 'running', 'waiting_human', 'verified'].includes(phase);
    const stateClass = phase === 'verified' ? ' state-done' : phase === 'failed' ? ' state-failed' : '';
    return `
      <div class="card-action-row" data-card-id="${esc(c.id)}" data-action-id="${esc(action.id)}" data-action-revision="${action.revision}">
        <div class="card-action-copy">
          <div class="card-action-label">${esc(action.label)}</div>
          ${action.description ? `<div class="card-action-description">${esc(action.description)}</div>` : ''}
        </div>
        <button class="card-action-btn${stateClass}" data-typed-action="${esc(action.id)}" ${disabled ? 'disabled' : ''}>${esc(actionButtonText(phase, action))}</button>
        <div class="card-action-note ${esc(phase)}" aria-live="polite">${esc(note)}</div>
      </div>`;
  }).join('');
  const setupError = uiState.actionRunError
    ? `<div class="card-action-contract-error">Action runner unavailable: ${esc(uiState.actionRunError)}</div>`
    : '';
  return `<div class="card-actions"><div class="card-actions-title">Actions</div>${setupError}${rows}</div>`;
}

function refreshTypedActionRow(row, action, run) {
  if (!row) return;
  const phase = PulseActions.runPhase(run);
  const btn = row.querySelector('.card-action-btn');
  const note = row.querySelector('.card-action-note');
  if (btn) {
    btn.textContent = actionButtonText(phase, action);
    btn.disabled = ['queued', 'running', 'waiting_human', 'verified'].includes(phase);
    btn.classList.toggle('state-done', phase === 'verified');
    btn.classList.toggle('state-failed', phase === 'failed');
  }
  if (note) {
    note.textContent = PulseActions.safeResultMessage(run, action);
    note.className = `card-action-note ${phase}`;
  }
}

function refreshTypedActionRows(c, action, run) {
  document.querySelectorAll('.card-action-row').forEach(row => {
    if (row.dataset.cardId === String(c.id) &&
        row.dataset.actionId === action.id &&
        Number(row.dataset.actionRevision) === action.revision) {
      refreshTypedActionRow(row, action, run);
    }
  });
}

async function fetchExistingTypedRun(idempotencyKey) {
  const { data, error } = await sb.from('mac_commands')
    .select('id,status,result,pulse_card_id,pulse_action_id,pulse_revision,attempt,idempotency_key,created_at')
    .eq('idempotency_key', idempotencyKey)
    .single();
  return error ? null : data;
}

async function pollTypedActionCommand(c, action, commandId) {
  const pollKey = String(commandId);
  if (uiState.actionPollers.has(pollKey)) return;
  uiState.actionPollers.add(pollKey);
  const started = Date.now();
  try {
    while (Date.now() - started < 75000) {
      const { data, error } = await sb.from('mac_commands')
        .select('id,status,result,pulse_card_id,pulse_action_id,pulse_revision,attempt,idempotency_key,created_at')
        .eq('id', commandId).single();
      if (error) {
        refreshTypedActionRows(c, action, {
          status: 'failed',
          result: { safe_message: 'Pulse could not read the action receipt. Use Ask Pulse to diagnose before retrying.' },
        });
        return;
      }
      const key = PulseActions.actionRunKey(c.id, action);
      uiState.actionRuns.set(key, data);
      refreshTypedActionRows(c, action, data);
      const phase = PulseActions.runPhase(data);
      if (phase === 'verified') {
        if (action.completion.close_card) await maybeResolveTypedActionCard(c);
        return;
      }
      if (phase === 'failed') return;
      await new Promise(resolve => setTimeout(resolve, 1500));
    }
  } finally {
    uiState.actionPollers.delete(pollKey);
  }
}

async function maybeResolveTypedActionCard(c) {
  if (uiState.resolvingCards.has(c.id)) return;
  const parsed = typedActions(c);
  if (parsed.errors.length || !parsed.actions.length) return;
  const allVerified = parsed.actions.every(action =>
    PulseActions.runPhase(typedActionRun(c, action)) === 'verified'
  );
  if (!allVerified) return;
  uiState.resolvingCards.add(c.id);
  try {
    const { error } = await sb.from('pulse_cards').update({
      status: 'resolved',
      resolved_note: 'All requested actions completed with verified receipts.',
      answered_at: new Date().toISOString(),
    }).eq('id', c.id).eq('status', 'open');
    if (!error) loadCards();
  } finally {
    uiState.resolvingCards.delete(c.id);
  }
}

async function runTypedCardAction(c, action, btn) {
  if (uiState.actionRunError) return;
  btn.disabled = true;
  const existing = typedActionRun(c, action);
  const existingPhase = PulseActions.runPhase(existing);
  if (existing && ['queued', 'running', 'waiting_human'].includes(existingPhase)) {
    await pollTypedActionCommand(c, action, existing.id);
    return;
  }
  if (existingPhase === 'verified') return;

  const attempt = PulseActions.nextAttempt(existing);
  // CODE#5 (2026-08-14): this used to branch on c.queue_state === 'queued'
  // and call an RPC (enqueue_pulse_action) that has never existed in the
  // live database — queue v1 was authored (migration + this branch) but the
  // migration was never applied, so that branch was unreachable dead code
  // against production. Removed; the direct-INSERT path below (the one
  // every real typed-action card has always actually used) is now the only
  // path.
  const row = PulseActions.buildCommandRow(c, action, attempt);
  const result = await sb.from('mac_commands').insert(row).select().single();
  let error = result.error;
  let run = result.data;
  if (error && error.code === '23505') {
    run = await fetchExistingTypedRun(row.idempotency_key);
    error = null;
  }
  if (error) {
    refreshTypedActionRows(c, action, {
      status: 'failed',
      result: { safe_message: 'Pulse could not queue this action. Nothing was executed. Use Ask Pulse to diagnose.' },
    });
    return;
  }
  if (!run) {
    refreshTypedActionRows(c, action, {
      status: 'failed',
      result: { safe_message: 'Pulse found an existing request but could not resume it. Use Ask Pulse to diagnose.' },
    });
    return;
  }
  uiState.actionRuns.set(PulseActions.actionRunKey(c.id, action), run);
  refreshTypedActionRows(c, action, run);
  await pollTypedActionCommand(c, action, run.id);
}

function wireTypedCardActions(div, c) {
  const parsed = typedActions(c);
  if (parsed.errors.length || c.status !== 'open') return;
  parsed.actions.forEach(action => {
    const btn = [...div.querySelectorAll('[data-typed-action]')]
      .find(candidate => candidate.dataset.typedAction === action.id);
    if (!btn) return;
    btn.onclick = () => runTypedCardAction(c, action, btn);
    const run = typedActionRun(c, action);
    if (run && ['queued', 'running', 'waiting_human'].includes(PulseActions.runPhase(run))) {
      pollTypedActionCommand(c, action, run.id);
    }
  });
  if (parsed.actions.some(action => action.completion.close_card) &&
      parsed.actions.every(action => PulseActions.runPhase(typedActionRun(c, action)) === 'verified')) {
    maybeResolveTypedActionCard(c);
  }
}

async function loadTypedActionRuns(cards) {
  uiState.actionRuns = new Map();
  uiState.actionRunError = null;
  const ids = (cards || [])
    .filter(card => typedActions(card).actions.length)
    .map(card => card.id);
  if (!ids.length) return;
  const { data, error } = await sb.from('mac_commands')
    .select('id,status,result,pulse_card_id,pulse_action_id,pulse_revision,attempt,idempotency_key,created_at')
    .in('pulse_card_id', ids)
    .order('created_at', { ascending: false })
    .limit(1000);
  if (error) {
    uiState.actionRunError = 'the typed-action database migration has not been applied or this account lacks access';
    return;
  }
  for (const run of data || []) {
    if (!run.pulse_action_id || !run.pulse_revision) continue;
    const key = `${run.pulse_card_id}:${run.pulse_action_id}:r${run.pulse_revision}`;
    const current = uiState.actionRuns.get(key);
    if (!current || Number(run.attempt || 0) > Number(current.attempt || 0)) {
      uiState.actionRuns.set(key, run);
    }
  }
}

function guideMeSteps(steps) {
  const lines = (steps || '').split('\n').map(s => s.trim()).filter(Boolean);
  const items = lines.map(l => `<li>${esc(l)}</li>`).join('');
  showOverlay(`<h2>Guide me</h2><ol>${items || '<li>(no steps given)</li>'}</ol>`);
}

// Attempt to trigger a Yeshie recipe via the local relay (localhost:3333/run,
// CORS open, no auth on this endpoint as of 2026-07-26 — see yeshie/CLAUDE.md).
// Only reachable when the browser viewing this board is on the same machine
// as the relay. If the fetch fails (different device, relay down, mixed-content
// block on remote HTTPS pages calling http://localhost), fall back to copying
// the task payload to the clipboard with manual instructions.
// Confirmed live 2026-07-26 (Dee, CDP verification against the deployed
// HTTPS origin): a fetch from this page to http://localhost:3333 does not
// error and does not resolve — Chrome's Private Network Access check
// silently stalls it rather than rejecting. A plain try/catch around fetch
// never fires, so this needs a hard client-side race against a timeout or
// the button hangs on "Running…" forever. See README "Yeshie wiring status."
function timeoutAfter(ms, msg) {
  return new Promise((_, reject) => setTimeout(() => reject(new Error(msg)), ms));
}

async function runYeshieTask(task, btn) {
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Running…';
  try {
    const resp = await Promise.race([
      fetch('http://localhost:3333/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ payload: task, timeoutMs: 60000 }),
      }),
      timeoutAfter(4000, 'relay unreachable from this page (timed out after 4s)'),
    ]);
    if (!resp.ok) throw new Error(`relay ${resp.status}`);
    const result = await resp.json();
    btn.textContent = orig;
    btn.disabled = false;
    showOverlay(`<h2>Yeshie ran it</h2><p style="font-size:13.5px;white-space:pre-wrap;">${esc(JSON.stringify(result, null, 2))}</p>`);
  } catch (err) {
    btn.textContent = orig;
    btn.disabled = false;
    try { await navigator.clipboard.writeText(JSON.stringify(task, null, 2)); } catch (_) {}
    showOverlay(`
      <h2>Couldn't reach the relay</h2>
      <p style="font-size:13.5px;">${esc(String(err.message || err))}</p>
      <p style="font-size:13.5px;">Task payload copied to clipboard. On the Mac running the relay:</p>
      <ol style="font-size:13.5px;">
        <li>Confirm relay is up: <code>curl localhost:3333/status</code></li>
        <li>Run it: <code>node scripts/run-async.mjs &lt;recipe&gt;</code> in <code>~/Projects/yeshie</code>, or paste the clipboard payload into a <code>yeshie_run</code> call.</li>
      </ol>`);
  }
}

function togglePreview(div, url) {
  let wrap = div.querySelector('.preview-wrap');
  if (wrap) { wrap.remove(); return; }
  wrap = document.createElement('div');
  wrap.className = 'preview-wrap';
  const iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
  wrap.appendChild(iframe);
  const anchor = div.querySelector('.action-line') || div.querySelector('.title');
  anchor.insertAdjacentElement('afterend', wrap);

  const setAt = Date.now();
  let gotLoad = false;
  iframe.addEventListener('load', () => {
    gotLoad = true;
    const delta = Date.now() - setAt;
    // Heuristic: a load that fires implausibly fast for a real page usually
    // means the navigation was aborted (X-Frame-Options / frame-ancestors)
    // and the frame settled on about:blank instead.
    if (delta < 150) { flagBlocked(wrap, url); return; }
    // UX#8 dead-timing-zone fix (2026-08-14): a real X-Frame-Options block
    // can fire `load` at a perfectly ordinary in-between delay (a real
    // cross-origin round trip happens before the browser blocks rendering),
    // satisfying neither timing extreme above. Second signal, shortly after
    // load: best-effort read contentWindow.location.href. It's only
    // same-origin-readable (no throw) when the frame actually settled on
    // about:blank — exactly what an XFO/frame-ancestors block leaves behind.
    // A real different-origin page throws on the read, which correctly means
    // "not blocked, nothing to flag."
    setTimeout(() => {
      try {
        if (iframe.contentWindow && iframe.contentWindow.location.href === 'about:blank') {
          flagBlocked(wrap, url);
        }
      } catch (_) { /* cross-origin read threw = real page loaded, not blocked */ }
    }, 400);
  });
  iframe.src = url;
  setTimeout(() => { if (!gotLoad) flagBlocked(wrap, url); }, 2500);
}

function flagBlocked(wrap, url) {
  if (wrap.querySelector('.preview-note')) return;
  const note = document.createElement('div');
  note.className = 'preview-note';
  note.innerHTML = `Site refuses embedding (or is slow) — <a href="${esc(url)}" target="_blank" rel="noopener">Open instead</a>.`;
  wrap.appendChild(note);
}

async function bounceByMike(c) {
  // CODE#7 (2026-08-14): guard on status=open, mirroring the one write in
  // this file that already got this right (maybeResolveTypedActionCard's
  // .eq('status','open')). Without it, a Mike-vs-nightly-drain race (or a
  // cross-device double-answer) could silently bounce a card that already
  // moved to answered/resolved/retired under us.
  const { data, error } = await sb.from('pulse_cards').update({
    status: 'bounced',
    bounce_reason: 'Not mine (Mike)',
    answered_at: new Date().toISOString(),
  }).eq('id', c.id).eq('status', 'open').select();
  if (error) { alert('Failed: ' + error.message); return; }
  if (!data || !data.length) { alert('This card already changed — reloading.'); loadCards(); return; }
  loadCards();
}

// ── Snooze ──────────────────────────────────────────────────────────
// A snoozed card stays status='open' — snoozing is a visibility window on
// top of open, not a separate status — so nothing bypasses the existing
// answer/bounce/resolve flows. isSnoozedActive() is the single source of
// truth both the default-view filter and the "N snoozed" affordance use.
function isSnoozedActive(c) {
  return !!c.snoozed_until && new Date(c.snoozed_until) > new Date();
}

function snoozePresets() {
  const now = new Date();
  const tonight = new Date(now);
  tonight.setHours(20, 0, 0, 0);
  if (tonight <= now) { tonight.setTime(now.getTime() + 3 * 60 * 60 * 1000); } // already past 8pm — push 3h out instead
  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate() + 1);
  tomorrow.setHours(8, 0, 0, 0);
  const nextWeek = new Date(now);
  nextWeek.setDate(nextWeek.getDate() + 7);
  nextWeek.setHours(8, 0, 0, 0);
  return [
    { label: 'Tonight', at: tonight },
    { label: 'Tomorrow morning', at: tomorrow },
    { label: 'Next week', at: nextWeek },
  ];
}

async function snoozeCard(id, until) {
  const { error } = await sb.from('pulse_cards').update({ snoozed_until: until.toISOString() }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  loadCards();
}

async function unsnoozeCard(id) {
  const { error } = await sb.from('pulse_cards').update({ snoozed_until: null }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  loadCards();
}

function openSnoozeMenu(c) {
  const presets = snoozePresets();
  const buttons = presets.map((pr, i) =>
    `<button class="btn-secondary" data-snooze-idx="${i}">${esc(pr.label)}</button>`
  ).join('');
  const backdrop = showOverlay(`<h2>Snooze until…</h2><div class="snooze-menu">${buttons}</div>`);
  backdrop.querySelectorAll('[data-snooze-idx]').forEach(btn => {
    btn.onclick = async () => {
      const pr = presets[Number(btn.dataset.snoozeIdx)];
      backdrop.remove();
      await snoozeCard(c.id, pr.at);
    };
  });
}

function renderSnoozedCard(c) {
  const title = cardTitleText(c);
  const until = new Date(c.snoozed_until);
  const div = document.createElement('div');
  div.className = 'snoozed-card';
  div.dataset.cardId = c.id;
  div.innerHTML = `
    <p class="title">${esc(title)}</p>
    <p class="until">Reopens ${esc(until.toLocaleString())}</p>

}

// ── Comments ────────────────────────────────────────────────────────
// Commenting never touches status — see FEATURE_2 in README. Comments are
// fetched embedded on each card via a PostgREST FK join (pulse_card_comments
// has a FK to pulse_cards), so no extra round trip per card.
function looksLikeSecret(text) {
  const value = (text || '').trim();
  if (!value) return false;
  const compact = value.replace(/\s+/g, '');
  return /^AIza[0-9A-Za-z_-]{20,}$/.test(compact) ||
    /^(sk-(?:ant|proj|live|test)-|sb_secret_|nfp_)[0-9A-Za-z_-]{12,}$/i.test(compact) ||
    /^[A-Za-z0-9]{16}$/.test(compact);
}

async function postComment(cardId, body) {
  if (looksLikeSecret(body)) {
    alert('That looks like a credential. It was not sent. Keep it on the Mac clipboard and use the task’s Install & verify button.');
    return;
  }
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('pulse_card_comments').insert({ card_id: cardId, author: 'mike', body });
  if (error) { alert('Failed: ' + error.message); return; }
  // Optimistic: mark this card as awaiting a reply *before* the realtime
  // pulse/full reload lands, so "thinking…" shows immediately, not after
  // whatever latency the subscription round-trip adds.
  uiState.pendingComment.set(cardId, nowIso);
  uiState.openComments.add(cardId);
  loadCards();
}

// A card is "pending" if Mike's last comment on it is newer than any
// non-mike reply — cleared here (not just on postComment) so a reply that
// lands from the realtime subscription's own reload correctly turns the
// indicator off without a manual page refresh.
function updatePendingState(c, comments) {
  const pendingSince = uiState.pendingComment.get(c.id);
  if (!pendingSince) return false;
  const reply = comments.find(cm => cm.author !== 'mike' && new Date(cm.created_at) > new Date(pendingSince));
  if (reply) { uiState.pendingComment.delete(c.id); return false; }
  return true;
}

function renderComments(c) {
  const comments = (c.pulse_card_comments || []).slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  const pending = updatePendingState(c, comments);
  const list = comments.map(cm => `
    <div class="comment-item"><span class="who">${esc(cm.author)} · ${esc(new Date(cm.created_at).toLocaleString())}</span>${esc(cm.body)}</div>
  `).join('');
  const pendingNote = pending ? `<div class="comment-pending">Pulse is asking the team…</div>` : '';
  const toggleLabel = comments.length ? `Pulse thread (${comments.length})` : 'Comment or give feedback on this card';
  return `
    <div class="comments">
      <button class="comment-toggle" data-action="toggle-comments">${toggleLabel}</button>
      <div class="comment-body" style="display:${uiState.openComments.has(c.id) ? 'block' : 'none'};">
        ${list}
        ${pendingNote}
        <div class="comment-input-row">
          <textarea class="textresp comment-input" rows="2" placeholder="Comment, rate, or ask — the team reads every card's thread (never paste credentials)"></textarea>
          <button class="btn-secondary" data-action="send-comment">Send</button>
        </div>
      </div>
    </div>`;
}

function wireComments(div, c) {
  const toggle = div.querySelector('[data-action="toggle-comments"]');
  const body = div.querySelector('.comment-body');
  if (!toggle || !body) return;
  toggle.onclick = () => {
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    if (open) uiState.openComments.delete(c.id); else uiState.openComments.add(c.id);
  };
  const input = div.querySelector('.comment-input');
  const send = div.querySelector('[data-action="send-comment"]');
  // CODE#9 (2026-08-14): a realtime pulse on ANY card full-rebuilds #cards,
  // which used to wipe whatever Mike was mid-typing into a comment box on a
  // DIFFERENT card — 64% of his closes are exactly this kind of in-conversation
  // prose answer (SOMA/pulse/USEFULNESS-2026-08-11.md). Restore any draft this
  // card had before the rebuild, and keep saving on every keystroke so the
  // next rebuild (which WILL happen — comments/status changes elsewhere fire
  // constantly) has something to restore from.
  const draft = uiState.commentDrafts.get(c.id);
  if (draft) input.value = draft;
  input.oninput = () => {
    const val = input.value;
    if (val) uiState.commentDrafts.set(c.id, val);
    else uiState.commentDrafts.delete(c.id);
  };
  const submit = () => {
    const val = input.value.trim();
    if (!val) return;
    uiState.commentDrafts.delete(c.id);
    postComment(c.id, val);
  };
  send.onclick = submit;
  // Enter sends (matches the old single-line input's behavior); Shift+Enter
  // inserts a newline, now that this is a <textarea> (UX#11).
  input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } };
}

function focusPulseThread(div, c) {
  const body = div.querySelector('.comment-body');
  const input = div.querySelector('.comment-input');
  if (!body || !input) return;
  body.style.display = 'block';
  uiState.openComments.add(c.id);
  input.focus();
}

function renderCard(c) {
  const p = c.payload || {};
  const answered = c.status !== 'open';
  // CODE#4 (2026-08-14): scheme-check every payload.url ONE TIME per render,
  // here, and use this everywhere the card would otherwise reach into href /
  // window.open / iframe.src with the raw value. A javascript:/data: URL
  // authored onto any card type now fails to render a link/button at all
  // (same "Invalid link" fallback pattern the step-action open_url path
  // already used correctly) instead of becoming a live code-exec path inside
  // Mike's authenticated session.
  const safeUrl = safeHttpUrl(p.url);
  let body = '';
  if (c.type === 'action') {
    const cardActionContract = typedActions(c);
    const hasTypedContract = Object.prototype.hasOwnProperty.call(p, 'actions');
    const hasTypedActions = cardActionContract.actions.length > 0;
    const typedActionsVerified = hasTypedActions && cardActionContract.actions.every(action =>
      PulseActions.runPhase(typedActionRun(c, action)) === 'verified'
    );
    const guideBtn = c.yeshie_steps ? `<button class="btn-secondary" data-action="guide">Guide me</button>` : '';
    const yeshieBtn = (!hasTypedContract && c.yeshie_task && YESHIE_FLAG) ? `<button class="btn-secondary" data-action="yeshie-run">Yeshie: do it — I'll watch</button>` : '';
    const doneBtn = !hasTypedContract || typedActionsVerified
      ? `<button class="btn-primary" data-action="done">Done</button>`
      : '';
    body = `
      <div class="action-line">
        <p class="title">${esc(cardTitleText(c))}${escalationBadge(c)}${sourceUnknownBadge(c)}</p>
      </div>
      ${p.why ? `<p class="why">${renderInlineText(p.why)}</p>` : ''}
      ${cardActionsPanel(c)}
      ${stepsAccordion(c.id, p.steps, c.step_state, p.step_actions)}
      <div class="actions">
        ${safeUrl ? `<button class="btn-primary" data-action="open">Open</button>` : ''}
        ${safeUrl ? `<button class="btn-secondary" data-action="preview">Preview</button>` : ''}
        ${guideBtn}
        ${yeshieBtn}
        <button class="btn-secondary" data-action="ask-pulse">Ask Pulse</button>
        ${doneBtn}
        <button class="btn-secondary" data-action="snooze">Snooze</button>
        <button class="btn-secondary" data-action="not-mine">Not mine</button>
      </div>`;
  } else if (c.type === 'verdict') {
    body = `
      <p class="title">${esc(cardTitleText(c))}${escalationBadge(c)}${sourceUnknownBadge(c)}</p>
      <p class="why">${renderInlineText(p.summary)}</p>
      ${safeUrl ? `<p><a class="link" href="${esc(safeUrl)}" target="_blank" rel="noopener">${esc(safeUrl)}</a></p>` : ''}
      <div class="actions">
        <button class="btn-primary" data-action="accept">Accept</button>
        <button class="btn-secondary" data-action="change">Change</button>
        <button class="btn-secondary" data-action="snooze">Snooze</button>
        <button class="btn-destructive" data-action="retire">Retire</button>
      </div>
      <input class="textresp" style="display:none" placeholder="What to change..." />`;
  } else if (c.type === 'decision') {
    // No silent truncation (Mike, 2026-08-14 fix order): every option is
    // rendered as a real button — a decision card used to hard-slice to the
    // first 4 with nothing on the card telling Mike a real choice ("Epsilon")
    // was missing. Buttons wrap via .actions{flex-wrap}, so extra options
    // just add rows, never get dropped.
    const opts = p.options || [];
    body = `
      <p class="title">${esc(cardTitleText(c))}${escalationBadge(c)}${sourceUnknownBadge(c)}</p>
      ${p.why ? `<p class="body-text">${renderInlineText(p.why)}</p>` : ''}
      ${safeUrl ? `<p class="body-text"><a href="${esc(safeUrl)}" target="_blank" rel="noopener">Full writeup &rarr;</a></p>` : ''}
      <div class="actions">
        ${opts.map((o, i) => `<button class="btn-secondary" data-action="opt" data-value="${esc(o)}">${esc(o)}</button>`).join('')}
        <button class="btn-secondary" data-action="other">Other</button>
        <button class="btn-secondary" data-action="snooze">Snooze</button>
      </div>
      <input class="textresp" style="display:none" placeholder="Your answer..." />`;
  } else if (c.type === 'brief') {
    // Short digest always visible (~2-second scan); full text, if the
    // producer supplied one, sits behind briefDrill()'s collapsed-by-
    // default panel — never dumped inline (Mike, 2026-08-13).
    body = `
      <p class="title">${esc(stripEscalationBanner(p.title) || 'Daily brief')}${escalationBadge(c)}${sourceUnknownBadge(c)}</p>
      <p class="body-text">${renderInlineText(p.lines || '')}</p>
      ${briefDrill(c.id, p.full_text)}
      <div class="actions">
        <button class="btn-secondary" data-action="ack">Ack</button>
        <button class="btn-secondary" data-action="snooze">Snooze</button>
      </div>`;
  }
  const div = document.createElement('div');
  div.className = 'card' + (answered ? ' answered' : '');
  div.dataset.cardId = c.id;
  div.innerHTML = `<span class="kind kind-${c.type}">${cardKindLabel(c.type)}</span>${body}` +
    (answered ? `<div class="answer-tag">${esc(c.status)}${c.answer ? ': ' + esc(JSON.stringify(c.answer.value ?? c.answer)) : ''}${c.resolved_note ? ': ' + esc(c.resolved_note) : ''}</div>` : '') +
    renderComments(c);

  if (!answered) {
    div.querySelectorAll('button[data-action]').forEach(btn => {
      btn.onclick = async () => {
        const action = btn.dataset.action;
        // Local, non-persisting actions specific to the action-card layout.
        if (action === 'open') { if (safeUrl) window.open(safeUrl, '_blank', 'noopener'); return; }
        if (action === 'preview') { if (safeUrl) togglePreview(div, safeUrl); return; }
        if (action === 'guide') { guideMeSteps(c.yeshie_steps); return; }
        if (action === 'yeshie-run') { await runYeshieTask(c.yeshie_task, btn); return; }
        if (action === 'ask-pulse') { focusPulseThread(div, c); return; }
        if (action === 'not-mine') { btn.disabled = true; await bounceByMike(c); return; }
        if (action === 'snooze') { openSnoozeMenu(c); return; }
        if (action === 'other' || action === 'change') {
          const input = div.querySelector('.textresp');
          input.style.display = 'block';
          input.focus();
          input.onkeydown = async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
              div.querySelectorAll('.actions button').forEach(b => { b.disabled = true; });
              await answerCard(c, { action_id: action, value: input.value.trim() });
            }
          };
          return;
        }
        const value = btn.dataset.value || action;
        // CODE#6/#7 double-tap guard (2026-08-14): disable the whole action
        // row synchronously before the await, mirroring the pattern
        // runTypedCardAction/runStepAction already get right. A fast
        // double-tap on a decision option used to fire two PATCHes with no
        // guard and no UI signal that anything changed on the second tap.
        div.querySelectorAll('.actions button').forEach(b => { b.disabled = true; });
        await answerCard(c, { action_id: action, value });
      };
    });
  }
  wireSteps(div, c);
  wireTypedCardActions(div, c);
  wireComments(div, c);
  if (c.type === 'brief') wireDrill(div, `brief:${c.id}`);
  return div;
}

function renderBouncedCard(c) {
  const title = cardTitleText(c);
  const div = document.createElement('div');
  div.className = 'bounced-card';
  div.dataset.cardId = c.id;
  div.innerHTML = `<p class="title">${esc(title)}</p><p class="reason">${esc(c.bounce_reason || '(no reason given)')} — <span class="muted">from ${esc(c.created_by)}</span></p>`;
  return div;
}

async function answerCard(cardOrId, answer) {
  const card = typeof cardOrId === 'object' ? cardOrId : null;
  const id = card ? card.id : cardOrId;
  // CODE#5 (2026-08-14): removed the queue_state==='queued' RPC branch —
  // answer_pulse_gate_v1 has never existed in the live database (queue v1's
  // migration was authored, never applied); every real card takes this one
  // path below.
  //
  // CODE#7 (2026-08-14): status=open guard — this legacy answer path (used
  // by every card in production) had no protection against double-tap,
  // cross-device, or Mike-vs-drain races. .select() so an empty return is
  // distinguishable from a real success (PostgREST returns [] on a WHERE
  // that matches nothing).
  const { data, error } = await sb.from('pulse_cards').update({
    status: answer.action_id === 'retire' || answer.action_id === 'skip' ? 'retired' : 'answered',
    answer,
    answered_at: new Date().toISOString()
  }).eq('id', id).eq('status', 'open').select();
  if (error) { alert('Failed: ' + error.message); return; }
  if (!data || !data.length) { alert('This card already changed — reloading.'); loadCards(); return; }
  loadCards();
}


// ── Offline board snapshot (UX#3, 2026-08-14) ───────────────────────────
// Persists just the open-card set — the part of the board offline actually
// matters for ("what does Mike need to see right now") — not the full
// history/bounced/typed-action-run state, which would bloat localStorage for
// no offline-facing benefit and go stale in ways that would be confusing to
// half-render (a "Done" click that can't reach the network, etc).
const OFFLINE_SNAPSHOT_KEY = 'pulse_offline_snapshot_v1';

function saveOfflineSnapshot(openCards) {
  try {
    localStorage.setItem(OFFLINE_SNAPSHOT_KEY, JSON.stringify({
      at: Date.now(),
      cards: (openCards || []).map(c => ({
        id: c.id, type: c.type, payload: c.payload, status: c.status,
        created_by: c.created_by, snoozed_until: c.snoozed_until,
      })),
    }));
  } catch (_) { /* localStorage full/unavailable — offline fallback just won't have data */ }
}

function readOfflineSnapshot() {
  try {
    const raw = localStorage.getItem(OFFLINE_SNAPSHOT_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return (parsed && Array.isArray(parsed.cards) && parsed.cards.length) ? parsed : null;
  } catch (_) {
    return null;
  }
}

function formatAgo(ms) {
  const mins = Math.round((Date.now() - ms) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  return `${Math.round(hours / 24)}d ago`;
}

function renderOfflineSnapshot(main, snapshot) {
  const banner = document.createElement('div');
  banner.className = 'offline-banner';
  banner.textContent = `Offline — showing ${snapshot.cards.length} open card${snapshot.cards.length === 1 ? '' : 's'} as of ${formatAgo(snapshot.at)}. Reconnect to act on anything.`;
  main.appendChild(banner);
  // Read-only rendering: reuse renderCard() for the visual, but strip every
  // interactive affordance so nothing here can attempt a network write while
  // offline (a click that silently fails, or worse queues confusingly, is
  // worse than no button at all).
  snapshot.cards.forEach(c => {
    const div = renderCard(c);
    div.querySelectorAll('button, input, textarea, a[href]').forEach(el => {
      if (el.tagName === 'A') el.removeAttribute('href');
      else el.disabled = true;
    });
    main.appendChild(div);
  });
}

async function loadLegacyCards() {
  // Active work and terminal history are separate queries. A single
  // status-sorted LIMIT could otherwise hide every open card once terminal
  // history grows past 100 rows.
  const [activeResult, historyResult] = await Promise.all([
    sb.from('pulse_cards')
      .select('*, pulse_card_comments(*)')
      .eq('app_id', APP_ID)
      .eq('status', 'open')
      .order('created_at', { ascending: false })
      .limit(100),
    sb.from('pulse_cards')
      .select('*, pulse_card_comments(*)')
      .eq('app_id', APP_ID)
      .neq('status', 'open')
      .order('created_at', { ascending: false })
      .limit(45),
  ]);
  const error = activeResult.error || historyResult.error;
  const data = [...(activeResult.data || []), ...(historyResult.data || [])];
  const main = document.getElementById('cards');
  if (!main) return;
  main.innerHTML = '';
  if (error) {
    // UX#3 (2026-08-14): a network-shaped failure while a prior snapshot
    // exists shows the last-known open cards with a visible staleness
    // banner instead of a bare "Load error" — the previous behavior handed
    // the whole board off to nothing, on exactly the elevator/subway/weak-
    // signal moments Mike would actually reach for this.
    const offlineLike = !navigator.onLine ||
      /failed to fetch|networkerror|load failed/i.test(error.message || '');
    const snapshot = offlineLike ? readOfflineSnapshot() : null;
    if (snapshot) {
      renderOfflineSnapshot(main, snapshot);
      return;
    }
    main.innerHTML = `<div class="empty">Load error: ${esc(error.message)}</div>`;
    return;
  }
  saveOfflineSnapshot(data.filter(c => c.status === 'open' && !isSnoozedActive(c)));
  await loadTypedActionRuns(data);
  // "open" = the default view: status open AND not currently snoozed.
  // Snoozed-active cards are pulled out into their own section so nothing
  // silently vanishes — see isSnoozedActive() / renderSnoozedCard().
  const open = (data || []).filter(c => c.status === 'open' && !isSnoozedActive(c));
  const snoozed = (data || []).filter(c => c.status === 'open' && isSnoozedActive(c));
  const bounced = (data || []).filter(c => c.status === 'bounced').slice(0, 30);
  const done = (data || []).filter(c => c.status !== 'open' && c.status !== 'bounced').slice(0, 15);
  document.getElementById('count').innerHTML = esc(open.length + ' open') +
    (snoozed.length ? ` · <span class="snooze-count" id="snooze-count-badge">${esc(snoozed.length + ' snoozed')}</span>` : '');
  if (!data || data.length === 0) {
    main.innerHTML = '<div class="empty">Nothing to manage right now.</div>';
    return;
  }
  if (!open.length) {
    main.innerHTML = '<div class="empty">Nothing open right now.</div>';
  } else {
    renderDrillHint(main);
    open.forEach(c => main.appendChild(renderCard(c)));
  }
  if (snoozed.length) {
    const details = document.createElement('details');
    details.className = 'bounced-section';
    details.id = 'snoozed-section';
    details.innerHTML = `<summary>Snoozed — ${snoozed.length}</summary>`;
    snoozed.forEach(c => details.appendChild(renderSnoozedCard(c)));
    main.appendChild(details);
  }
  if (done.length) {
    const details = document.createElement('details');
    details.className = 'bounced-section';
    details.innerHTML = `<summary>Recently done — ${done.length}</summary>`;
    done.forEach(c => details.appendChild(renderCard(c)));
    main.appendChild(details);
  }
  if (bounced.length) {
    const details = document.createElement('details');
    details.className = 'bounced-section';
    details.innerHTML = `<summary>Bounced (RSI) — ${bounced.length}</summary>`;
    bounced.forEach(c => details.appendChild(renderBouncedCard(c)));
    main.appendChild(details);
  }
  const countBadge = document.getElementById('snooze-count-badge');
  if (countBadge) {
    countBadge.onclick = () => {
      const sec = document.getElementById('snoozed-section');
      if (sec) { sec.open = true; sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    };
  }
}

// ── Per-card deep link (UX#9 / handshake-protocol-v1.md R2) ────────────────
// ?card=<id> scrolls to and highlights the matching card, opening its
// collapsed section (snoozed/done/bounced) if that's where it lives. One-shot
// per page load — every realtime pulse re-runs loadCards(), and re-yanking
// scroll position on every unrelated update would fight
// reloadCardsPreservingScroll()'s whole purpose.
let deepLinkHandled = false;
function applyCardDeepLink() {
  if (deepLinkHandled) return;
  const id = new URLSearchParams(location.search).get('card');
  if (!id) { deepLinkHandled = true; return; }
  const el = document.querySelector(`[data-card-id="${CSS.escape(id)}"]`);
  if (!el) return; // not rendered yet this pass; try again on the next loadCards()
  deepLinkHandled = true;
  const details = el.closest('details');
  if (details) details.open = true;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const prevOutline = el.style.outline, prevOffset = el.style.outlineOffset;
  el.style.outline = '2px solid #6ea8fe';
  el.style.outlineOffset = '2px';
  setTimeout(() => { el.style.outline = prevOutline; el.style.outlineOffset = prevOffset; }, 3000);
}

async function loadCards() {
  const result = await loadLegacyCards();
  applyCardDeepLink();
  return result;
}

// Any realtime pulse on ANY card (someone else's step checked, a comment
// posted anywhere on the board) rebuilds #cards from scratch via
// main.innerHTML = ''. uiState already survives that rebuild (open drills,
// pins, comment threads); scroll position did not — Mike (2026-08-14):
// checking a step mid-flow on one card kept getting yanked back to the top
// of the board because an unrelated card's realtime event landed while he
// was reading. Same class of bug as the drill-state comment above, just
// the one piece that wasn't carried over.
async function reloadCardsPreservingScroll() {
  const y = window.scrollY;
  await loadCards();
  window.scrollTo(0, y);
}

async function renderApp(session) {
  app.innerHTML = `
    <header><h1>Pulse Zero</h1><span class="count" id="count"></span></header>
    <main id="cards"><div class="empty">Loading...</div></main>`;
  await loadCards();
  if (!cardsChannel) {
    cardsChannel = sb.channel('pulse_cards_live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pulse_cards' }, () => reloadCardsPreservingScroll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pulse_card_comments' }, () => reloadCardsPreservingScroll())
      .subscribe();
  }
}

function stopCardsRealtime() {
  if (!cardsChannel) return;
  const oldChannel = cardsChannel;
  cardsChannel = null;
  sb.removeChannel(oldChannel);
}

// A session that isn't Mike's is treated as no session for everything
// privileged (voice broker, realtime subscribe), so a wrong Google account
// can't hold an authenticated-looking shell.
function route(session) {
  const owner = isOwner(session);
  setPulseSession(owner ? session : null);
  const identity = !session
    ? 'signed-out'
    : `${owner ? 'owner' : 'wrong-account'}:${session.user.id}`;
  // Supabase commonly emits INITIAL_SESSION immediately after getSession().
  // Rendering the same identity twice starts two overlapping card loads; the
  // slower one can reset the board to "Loading..." after the first finished.
  // Token refreshes still update Pulse's session above without rebuilding UI.
  if (identity === routedIdentity) return;
  routedIdentity = identity;
  if (!session) { stopCardsRealtime(); renderLogin(); }
  else if (owner) renderApp(session);
  else { stopCardsRealtime(); renderWrongAccount(session); }
}

// UX#3 (2026-08-14): register the offline shell worker. Best-effort — a
// registration failure (unsupported browser, sandboxed context) must never
// block the board itself from loading.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((err) => {
      console.warn('sw.js registration failed (non-fatal):', err);
    });
  });
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  route(session);
  sb.auth.onAuthStateChange((event, session) => route(session));
}
boot();
</script>

<script type="module">
  import { Conversation } from 'https://esm.sh/@elevenlabs/client@latest';

  // Persists the user's last explicit Start/End choice — NOT a one-time mic
  // consent flag. Only '1' while the user's last click was Start; cleared on
  // End, on error, and on unexpected disconnect. Auto-resume (tab refocus,
  // sign-in, page load) checks this so Pulse never comes back "available"
  // unless the user actually asked it to.
  const ACTIVE_KEY = 'pulse-talk-active';

  const orb = document.getElementById('talk-orb');
  const label = document.getElementById('talk-label');
  const sub = document.getElementById('talk-sub');
  const btn = document.getElementById('talk-btn');

  let conversation = null;
  let starting = false;
  let wantActive = false; // user's intent: should we be connected right now
  let pausingForHidden = false; // true only during the tab-hidden auto-pause below

  async function getSignedUrl() {
    const { data: { session } } = await window.pulseSupabase.auth.getSession();
    if (!session || !session.access_token) throw new Error('Sign in to Pulse first.');
    const response = await fetch('/.netlify/functions/pulse-agent-session', {
      headers: { Authorization: `Bearer ${session.access_token}` },
      cache: 'no-store',
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok || !body.signed_url) {
      throw new Error(body.error || 'Could not authorize Pulse voice.');
    }
    return body.signed_url;
  }

  function setOrb(mode) {
    orb.className = mode; // 'off' | 'listening' | 'speaking' | 'thinking'
  }

  function setUi(state, detail) {
    if (state === 'off') {
      setOrb('off');
      label.textContent = 'Talk to Pulse';
      sub.textContent = detail || 'Tap to start — ambient, hands-free after that';
      btn.textContent = 'Start';
      btn.className = 'start';
    } else if (state === 'connecting') {
      setOrb('thinking');
      label.textContent = 'Connecting…';
      sub.textContent = '';
      btn.textContent = 'Cancel';
      btn.className = 'end';
    } else if (state === 'listening') {
      setOrb('listening');
      label.textContent = 'Pulse is listening';
      sub.textContent = 'Just talk — no button needed';
      btn.textContent = 'End';
      btn.className = 'end';
    } else if (state === 'speaking') {
      setOrb('speaking');
      label.textContent = 'Pulse is speaking';
      sub.textContent = 'You can interrupt any time';
      btn.textContent = 'End';
      btn.className = 'end';
    } else if (state === 'thinking') {
      setOrb('thinking');
      label.textContent = 'Pulse is thinking…';
      sub.textContent = '';
      btn.textContent = 'End';
      btn.className = 'end';
    } else if (state === 'error') {
      setOrb('off');
      label.textContent = 'Talk unavailable';
      sub.textContent = detail || 'Something went wrong. Tap to retry.';
      btn.textContent = 'Retry';
      btn.className = 'start';
    }
  }

  // 2026-07-26 bugfix: getUserMedia() can hang forever — resolves neither
  // resolve nor reject — even when navigator.permissions.query reports the
  // mic as 'granted'. Reproduced live via CDP: Permissions API said
  // 'granted', but getUserMedia() itself never settled (confirmed with a
  // 5s race that always hit the timeout branch, never the getUserMedia
  // branch). This matches a known Chromium/macOS behavior where the OS-level
  // TCC microphone entitlement for Chrome is off/unavailable — the in-page
  // permission state can say 'granted' while the actual OS mic grab never
  // completes, and Chrome does not surface that as a rejected promise. This
  // is what "Talk to Pulse spins forever" was: an unbounded await with no
  // timeout, same failure mode already fixed for the Yeshie relay call
  // above. Bounding it here turns an infinite spin into an actionable error.
  function timeoutAfter(ms, message) {
    return new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms));
  }
  function mediaTimeout(ms) {
    return timeoutAfter(ms,
      'Microphone request timed out after ' + (ms / 1000) + 's. If this keeps happening, ' +
      'check System Settings -> Privacy & Security -> Microphone -> Google Chrome is ON ' +
      '(a known Chrome/macOS bug lets getUserMedia hang forever instead of failing when this is off).');
  }

  async function startTalk() {
    if (starting || conversation) return;
    starting = true;
    wantActive = true;
    setUi('connecting');
    try {
      const pre = await Promise.race([
        navigator.mediaDevices.getUserMedia({ audio: true }),
        mediaTimeout(8000),
      ]);
      pre.getTracks().forEach((t) => t.stop());
    } catch (err) {
      starting = false;
      wantActive = false;
      try { localStorage.setItem(ACTIVE_KEY, '0'); } catch (_) {}
      setUi('error', (err && err.message) || 'Microphone access denied.');
      return;
    }

    try {
      const signedUrl = await getSignedUrl();
      conversation = await Promise.race([
        Conversation.startSession({
          signedUrl,
          onConnect: () => { starting = false; setUi('listening'); },
          onDisconnect: () => {
            conversation = null;
            wantActive = false;
            if (!pausingForHidden) {
              try { localStorage.setItem(ACTIVE_KEY, '0'); } catch (_) {}
            }
            setUi('off');
          },
          onError: (err) => {
            conversation = null;
            starting = false;
            wantActive = false;
            try { localStorage.setItem(ACTIVE_KEY, '0'); } catch (_) {}
            setUi('error', String(err));
          },
          onModeChange: ({ mode }) => {
            if (mode === 'speaking') setUi('speaking');
            else if (mode === 'thinking' || mode === 'processing') setUi('thinking');
            else setUi('listening');
          },
        }),
        timeoutAfter(12000, 'ElevenLabs session setup timed out after 12s (agent unreachable or slow to connect).'),
      ]);
    } catch (err) {
      starting = false;
      wantActive = false;
      conversation = null;
      try { localStorage.setItem(ACTIVE_KEY, '0'); } catch (_) {}
      setUi('error', String(err));
    }
  }

  async function endTalk() {
    wantActive = false;
    starting = false;
    if (conversation) {
      try { await conversation.endSession(); } catch (_) {}
      conversation = null;
    }
    setUi('off');
  }

  btn.addEventListener('click', () => {
    if (conversation || starting) {
      endTalk();
      try { localStorage.setItem(ACTIVE_KEY, '0'); } catch (_) {}
    } else {
      try { localStorage.setItem(ACTIVE_KEY, '1'); } catch (_) {}
      startTalk();
    }
  });

  // Ambient: pause when the tab is hidden, resume when it's visible again —
  // "default ON while the tab is open and visible" without burning ElevenLabs
  // minutes on a backgrounded tab.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (conversation) {
        pausingForHidden = true;
        endTalk().then(() => { wantActive = true; pausingForHidden = false; });
      }
    } else if (wantActive && !conversation && !starting) {
      startTalk();
    }
  });

  // Voice exists only inside Pulse's authenticated boundary. Sign-out ends
  // the live session immediately; authenticated reloads can still honor the
  // user's previous ambient-listening choice.
  window.addEventListener('pulse-auth-state', ({ detail }) => {
    if (!detail.authenticated) {
      endTalk();
    } else if (localStorage.getItem(ACTIVE_KEY) === '1' && !document.hidden) {
      startTalk();
    }
  });
  if (window.pulseAuthenticated &&
      localStorage.getItem(ACTIVE_KEY) === '1' &&
      !document.hidden) {
    startTalk();
  }
</script>
